<meta charset="utf-8" />
<title>Spin Picker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<style>
  /* Light, committed game-show look on white. Every color painted explicitly. */
  :root {
    --bg: #ffffff;
    --bg-warm: #fbf9f4;
    --surface: #ffffff;
    --surface-2: #f6f3fb;
    --line: #e7e2ef;
    --line-strong: #d8d2e6;
    --ink: #1d1430;
    --ink-soft: #574c6d;
    --ink-faint: #948aa8;
    --gold: #ffc21f;
    --gold-deep: #e79a12;
    --gold-dark: #b9781a;
    --red: #e23b4e;
    --shadow-sm: 0 4px 14px rgba(40,25,70,.08);
    --shadow-md: 0 14px 34px rgba(40,25,70,.16);
    --r-lg: 24px;
    --r-md: 16px;
    --r-sm: 11px;
    --display: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    --body: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    font-family: var(--body);
    color: var(--ink);
    background: var(--bg);
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    width: 100%;
    max-width: 440px;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(120% 40% at 50% 0%, #fff8e6 0%, transparent 60%),
      var(--bg);
    box-shadow: 0 0 0 1px var(--line);
  }

  /* ---------- Top bar ---------- */
  .bar {
    display: flex; align-items: center; gap: 12px;
    padding: max(14px, env(safe-area-inset-top)) 18px 12px;
    min-height: 58px;
    border-bottom: 1px solid var(--line);
  }
  .bar h1 { font-family: var(--display); font-size: 19px; letter-spacing: .3px; font-weight: 800; flex: 1; }
  .bar .logo { font-size: 22px; }
  .iconbtn {
    appearance: none; border: 1px solid var(--line-strong); background: var(--surface);
    color: var(--ink); width: 40px; height: 40px; border-radius: 12px;
    font-size: 18px; cursor: pointer; display: grid; place-items: center;
    transition: transform .12s ease, background .12s ease; box-shadow: var(--shadow-sm);
  }
  .iconbtn:active { transform: scale(.92); }
  .iconbtn.gold { background: var(--gold); color: #4a2f00; border-color: var(--gold-deep); font-weight: 800; }

  /* ---------- Screens ---------- */
  .screen { flex: 1; display: none; flex-direction: column; }
  .screen.active { display: flex; }
  .scroll { flex: 1; overflow-y: auto; padding: 6px 18px 28px; }
  .eyebrow {
    text-transform: uppercase; letter-spacing: 2.5px; font-size: 11px;
    color: var(--gold-deep); font-weight: 800; margin: 12px 2px 14px;
  }

  /* ---------- Menu cards ---------- */
  .cardlist { display: flex; flex-direction: column; gap: 12px; }
  .wcard {
    display: flex; align-items: center; gap: 14px; padding: 16px;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md);
    cursor: pointer; text-align: left; color: inherit; box-shadow: var(--shadow-sm);
    transition: transform .12s ease, border-color .12s ease;
  }
  .wcard:active { transform: scale(.98); }
  .wcard:hover { border-color: var(--gold-deep); }
  .wcard .chip { width: 46px; height: 46px; flex: none; border-radius: 14px; display: grid; place-items: center; font-size: 24px; }
  .wcard .meta { flex: 1; min-width: 0; }
  .wcard .meta .t { font-weight: 700; font-size: 16px; }
  .wcard .meta .s { font-size: 13px; color: var(--ink-faint); margin-top: 2px; }
  .wcard .go { color: var(--ink-faint); font-size: 20px; }
  .newbtn {
    margin-top: 16px; width: 100%; padding: 16px; border-radius: var(--r-md);
    border: 1.5px dashed var(--line-strong); background: transparent; color: var(--ink-soft);
    font-size: 15px; font-weight: 600; cursor: pointer; transition: border-color .12s ease, color .12s ease;
  }
  .newbtn:hover { border-color: var(--gold-deep); color: var(--gold-deep); }

  /* ---------- Wheel (Big Wheel drum) screen ---------- */
  .stage-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 10px 18px 22px; }

  .drum {
    position: relative;
    width: min(86vw, 370px);
    height: 340px;
  }
  /* gold housing with marquee bulbs down each side */
  .drum::before, .drum::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 20px;
    background:
      repeating-linear-gradient(180deg, #fff6d8 0 4px, transparent 4px 22px),
      linear-gradient(180deg, var(--gold), var(--gold-deep));
    box-shadow: inset 0 0 0 1px var(--gold-dark);
  }
  .drum::before { left: -6px; border-radius: 16px 0 0 16px;
    background:
      radial-gradient(circle at 10px 11px, #fff7db 2.5px, transparent 3px) 0 0/20px 24px,
      linear-gradient(180deg, var(--gold), var(--gold-deep)); }
  .drum::after { right: -6px; border-radius: 0 16px 16px 0;
    background:
      radial-gradient(circle at 10px 11px, #fff7db 2.5px, transparent 3px) 0 0/20px 24px,
      linear-gradient(180deg, var(--gold), var(--gold-deep)); }

  .drum-window {
    position: absolute; inset: 0 8px;
    border-radius: 10px;
    overflow: hidden;
    background: linear-gradient(180deg, #efeaf6, #ffffff 20% 80%, #efeaf6);
    box-shadow: inset 0 0 0 2px var(--gold-dark), inset 0 14px 22px rgba(0,0,0,.16), inset 0 -14px 22px rgba(0,0,0,.16);
    perspective: 950px;
    perspective-origin: center;
  }
  .cyl { position: absolute; left: 8px; right: 8px; top: 50%; transform-style: preserve-3d; }
  .cyl-item {
    position: absolute; left: 0; right: 0; top: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 10px;
    font-family: var(--display); font-weight: 800;
    letter-spacing: .3px;
    backface-visibility: hidden;
    box-shadow: inset 0 0 0 2px rgba(0,0,0,.12);
    text-shadow: 0 1px 0 rgba(255,255,255,.35);
    padding: 0 14px;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .cyl-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }

  /* soft top/bottom fade so items roll into the housing */
  .drum-shade { position: absolute; inset: 0; pointer-events: none; z-index: 5;
    background: linear-gradient(180deg, rgba(255,255,255,.92), transparent 26% 74%, rgba(255,255,255,.92)); }

  /* center selection band */
  .center-band { position: absolute; left: 8px; right: 8px; top: 50%; height: 62px; transform: translateY(-50%);
    z-index: 6; pointer-events: none;
    border-top: 2px solid rgba(226,59,78,.5); border-bottom: 2px solid rgba(226,59,78,.5); }

  /* the arrow / flapper on the right, pointing left at the selected item */
  .flapper { position: absolute; right: -20px; top: 50%; transform: translateY(-50%); z-index: 8;
    width: 0; height: 0; border-top: 20px solid transparent; border-bottom: 20px solid transparent;
    border-right: 30px solid var(--red); filter: drop-shadow(-3px 0 3px rgba(0,0,0,.25)); }
  .flapper::after { content: ""; position: absolute; right: -46px; top: -7px; width: 30px; height: 14px;
    background: var(--red); border-radius: 3px; box-shadow: 0 2px 3px rgba(0,0,0,.25); }

  .spinbtn {
    appearance: none; border: none; cursor: pointer; font-family: var(--display);
    font-weight: 800; letter-spacing: 1.5px; font-size: 22px; text-transform: uppercase;
    color: #4a2f00; padding: 20px 0; width: min(86vw, 370px); border-radius: 20px;
    background: linear-gradient(180deg, #ffd85e, var(--gold) 55%, var(--gold-deep));
    box-shadow: 0 8px 0 var(--gold-dark), 0 16px 26px rgba(60,40,0,.22);
    transition: transform .09s ease, box-shadow .09s ease;
  }
  .spinbtn:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--gold-dark), 0 6px 12px rgba(60,40,0,.22); }
  .spinbtn:disabled { filter: grayscale(.4) brightness(.92); cursor: default; }
  .hint { color: var(--ink-faint); font-size: 13px; text-align: center; margin-top: -8px; }

  /* ---------- Result popup ---------- */
  .overlay { position: absolute; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center;
    padding: 24px; background: rgba(29,20,48,.55); backdrop-filter: blur(3px); }
  .overlay.show { display: flex; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; } }
  .result { position: relative; z-index: 22; width: 100%; background: var(--surface);
    border: 2px solid var(--gold); border-radius: var(--r-lg); padding: 30px 24px 26px; text-align: center;
    box-shadow: var(--shadow-md); animation: pop .45s cubic-bezier(.18,1.4,.4,1); }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } }
  .result .kicker { text-transform: uppercase; letter-spacing: 3px; font-size: 12px; color: var(--gold-deep); font-weight: 800; }
  .result .name { font-family: var(--display); font-weight: 800; font-size: clamp(38px, 12vw, 58px); line-height: 1.02;
    margin: 12px 0 6px; text-wrap: balance; color: var(--ink); }
  .result .from { color: var(--ink-faint); font-size: 14px; margin-bottom: 22px; }
  .result .actions { display: flex; gap: 10px; }
  .result .actions button { flex: 1; padding: 15px; border-radius: 14px; cursor: pointer; font-size: 15px; font-weight: 700; border: 1px solid var(--line-strong); }
  .btn-ghost { background: var(--surface-2); color: var(--ink); }
  .btn-gold { background: var(--gold); color: #4a2f00; border-color: var(--gold-deep) !important; }
  canvas.fx { position: absolute; inset: 0; z-index: 21; width: 100%; height: 100%; pointer-events: none; }

  /* ---------- Editor ---------- */
  .list-edit { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
  .opt { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow-sm); }
  .opt .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .opt span { flex: 1; font-size: 15px; }
  .opt button { background: none; border: none; color: var(--ink-faint); font-size: 18px; cursor: pointer; padding: 2px 6px; }
  .opt button:hover { color: var(--red); }
  .addrow { display: flex; gap: 8px; margin-top: 12px; }
  .addrow input, .field input { flex: 1; padding: 14px; border-radius: 12px; border: 1px solid var(--line-strong);
    background: var(--surface); color: var(--ink); font-size: 15px; font-family: var(--body); }
  .addrow input:focus, .field input:focus { outline: 2px solid var(--gold); border-color: transparent; }
  .addrow button { padding: 0 18px; border-radius: 12px; border: none; cursor: pointer; background: var(--gold); color: #4a2f00; font-weight: 800; font-size: 20px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--ink-faint); margin-bottom: 7px; }
  .emoji-pick { display: flex; gap: 8px; flex-wrap: wrap; }
  .emoji-pick button { width: 46px; height: 46px; border-radius: 12px; font-size: 22px; cursor: pointer; background: var(--surface); border: 1px solid var(--line-strong); }
  .emoji-pick button.sel { border-color: var(--gold-deep); background: #fff5d8; }
  .primary-wide { width: 100%; padding: 16px; margin-top: 8px; border-radius: 14px; border: none; background: var(--gold); color: #4a2f00; font-weight: 800; font-size: 16px; cursor: pointer; }
  .count-pill { display: inline-block; background: var(--surface-2); color: var(--ink-soft); border: 1px solid var(--line);
    padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; margin-left: 8px; vertical-align: middle; }
</style>

<div class="app" id="app">

  <!-- ======= MENU ======= -->
  <section class="screen active" id="screen-menu">
    <div class="bar"><span class="logo">🎡</span><h1>Spin Picker</h1></div>
    <div class="scroll">
      <p class="eyebrow">Your Wheels</p>
      <div class="cardlist" id="cardlist"></div>
      <button class="newbtn" id="btn-new">＋  New wheel</button>
    </div>
  </section>

  <!-- ======= WHEEL ======= -->
  <section class="screen" id="screen-wheel">
    <div class="bar">
      <button class="iconbtn" id="btn-back">‹</button>
      <h1 id="wheel-title">Wheel</h1>
      <button class="iconbtn" id="btn-edit">✎</button>
    </div>
    <div class="stage-wrap">
      <div class="drum">
        <div class="drum-window">
          <div class="cyl" id="cyl"></div>
          <div class="drum-shade"></div>
          <div class="center-band"></div>
        </div>
        <div class="flapper"></div>
      </div>
      <button class="spinbtn" id="btn-spin">Spin!</button>
      <p class="hint" id="wheel-hint"></p>
    </div>
  </section>

  <!-- ======= EDIT ======= -->
  <section class="screen" id="screen-edit">
    <div class="bar">
      <button class="iconbtn" id="btn-edit-back">‹</button>
      <h1 id="edit-title">Edit</h1>
      <button class="iconbtn gold" id="btn-edit-done">✓</button>
    </div>
    <div class="scroll">
      <div id="edit-newfields" style="display:none">
        <div class="field"><label>Wheel name</label><input id="edit-name" placeholder="e.g. Seminary — 1st Period" /></div>
        <div class="field"><label>Icon</label><div class="emoji-pick" id="emoji-pick"></div></div>
      </div>
      <p class="eyebrow" style="margin-bottom:6px">Options <span class="count-pill" id="opt-count">0</span></p>
      <div class="list-edit" id="list-edit"></div>
      <div class="addrow"><input id="add-input" placeholder="Add a name or option…" /><button id="add-btn">＋</button></div>
      <button class="primary-wide" id="create-btn" style="display:none">Create wheel</button>
    </div>
  </section>

  <!-- ======= RESULT OVERLAY ======= -->
  <div class="overlay" id="overlay">
    <canvas class="fx" id="fx"></canvas>
    <div class="result">
      <div class="kicker" id="result-kicker">🎉 The wheel picked</div>
      <div class="name" id="result-name">—</div>
      <div class="from" id="result-from"></div>
      <div class="actions">
        <button class="btn-ghost" id="result-close">Done</button>
        <button class="btn-gold" id="result-again">Spin again</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  const SEG_COLORS = ["#3ddc84","#ff5d6c","#ffd23f","#5aa9ff","#ff8a3d","#3ad0c0","#ff7eb6","#b98cff"];
  const EMOJIS = ["🎡","🎯","📖","🍿","⭐","🙋","🏆","🎲","🎤","🧭","🔥","🎁"];
  const ROW_H = 62;              // px height of each row on the drum
  const MAX_TILT = 90;          // rows past this angle are hidden

  let wheels = [
    { id: "w1", name: "Seminary — 1st Period", emoji: "📖",
      options: ["Emma","Oliver","Sophia","Liam","Ava","Noah","Mia","Ethan",
                "Isabella","Lucas","Harper","Mason","Ella","Logan","Grace",
                "Jack","Lily","Henry","Nora","Owen"] },
    { id: "w2", name: "Who prays today?", emoji: "🙋",
      options: ["Emma","Liam","Ava","Noah","Mia","Ethan","Grace","Jack"] },
    { id: "w3", name: "Class treat", emoji: "🍿",
      options: ["Donuts","Cookies","Popcorn","Fruit snacks","Otter Pops","Churros"] },
  ];

  let current = null, editingNew = false, draftEmoji = "🎡";
  let celebrateCount = 0, rotDeg = 0, spinning = false;
  let anglePer = 30, radius = 120;

  const $ = (id) => document.getElementById(id);
  const screens = { menu: $("screen-menu"), wheel: $("screen-wheel"), edit: $("screen-edit") };
  const cyl = $("cyl");

  function show(name) { Object.values(screens).forEach(s => s.classList.remove("active")); screens[name].classList.add("active"); }

  /* ---------- MENU ---------- */
  function renderMenu() {
    const list = $("cardlist"); list.innerHTML = "";
    wheels.forEach((w, i) => {
      const card = document.createElement("button");
      card.className = "wcard";
      const color = SEG_COLORS[i % SEG_COLORS.length];
      card.innerHTML = `<div class="chip" style="background:${color}2e;color:${shade(color)}">${w.emoji}</div>
        <div class="meta"><div class="t">${esc(w.name)}</div><div class="s">${w.options.length} option${w.options.length===1?"":"s"}</div></div>
        <div class="go">›</div>`;
      card.onclick = () => openWheel(w);
      list.appendChild(card);
    });
  }

  /* ---------- BIG WHEEL DRUM ---------- */
  function openWheel(w) {
    current = w; rotDeg = 0;
    $("wheel-title").textContent = w.name;
    $("wheel-hint").textContent = w.options.length + " on the wheel · tap Spin";
    buildDrum();
    show("wheel");
  }

  function buildDrum() {
    const n = current.options.length;
    cyl.innerHTML = "";
    if (n === 0) return;
    anglePer = 360 / n;
    // radius so consecutive rows sit ROW_H apart along the drum surface
    radius = (ROW_H / 2) / Math.tan((anglePer * Math.PI / 180) / 2);
    const fontSize = current.options.some(o => o.length > 10) ? 26 : 32;

    current.options.forEach((opt, i) => {
      const el = document.createElement("div");
      el.className = "cyl-item";
      el.style.height = ROW_H + "px";
      el.style.marginTop = (-ROW_H / 2) + "px";
      el.style.transform = `rotateX(${-i * anglePer}deg) translateZ(${radius}px)`;
      const c = SEG_COLORS[i % SEG_COLORS.length];
      el.style.background = c;
      el.style.color = shade(c);
      el.style.fontSize = fontSize + "px";
      el.innerHTML = `<span>${esc(opt)}</span>`;
      cyl.appendChild(el);
    });
    applyRotation();
  }

  // Hide rows that have rotated behind the drum so they don't flash through
  function applyRotation() {
    cyl.style.transform = `rotateX(${rotDeg}deg)`;
    const items = cyl.children;
    for (let i = 0; i < items.length; i++) {
      let a = ((rotDeg - i * anglePer) % 360 + 540) % 360 - 180; // -180..180, 0 = front
      items[i].style.visibility = Math.abs(a) > MAX_TILT ? "hidden" : "visible";
    }
  }

  function spin() {
    if (spinning || !current || current.options.length < 2) return;
    spinning = true; $("btn-spin").disabled = true;
    const n = current.options.length;
    const win = Math.floor(Math.random() * n);
    const targetBase = win * anglePer;                 // rotation bringing `win` to front
    const cur = ((rotDeg % 360) + 360) % 360;
    let delta = ((targetBase - cur) % 360 + 360) % 360;
    const turns = 4 + Math.floor(Math.random() * 3);
    const start = rotDeg, end = rotDeg + turns * 360 + delta;
    const dur = 4200 + Math.random() * 900;
    const ease = (t) => 1 - Math.pow(1 - t, 3);
    let t0 = null;
    function frame(ts) {
      if (t0 === null) t0 = ts;
      const p = Math.min(1, (ts - t0) / dur);
      rotDeg = start + (end - start) * ease(p);
      applyRotation();
      if (p < 1) requestAnimationFrame(frame);
      else { spinning = false; $("btn-spin").disabled = false; rotDeg = end % 360; reveal(current.options[win]); }
    }
    requestAnimationFrame(frame);
  }

  /* ---------- RESULT + FX ---------- */
  function reveal(name) {
    $("result-name").textContent = name;
    $("result-from").textContent = "from " + current.name;
    const fireworks = (celebrateCount++ % 2) === 1;
    $("result-kicker").textContent = (fireworks ? "🎆" : "🎉") + " The wheel picked";
    $("overlay").classList.add("show");
    fireworks ? runFireworks() : runConfetti();
  }

  const fx = $("fx"), fxc = fx.getContext("2d");
  let fxParticles = [], fxRAF = null;
  function sizeFx() { const r = fx.getBoundingClientRect(); fx.width = r.width; fx.height = r.height; }
  function stopFx() { if (fxRAF) cancelAnimationFrame(fxRAF); fxRAF = null; fxParticles = []; fxc.clearRect(0,0,fx.width,fx.height); }

  function runConfetti() {
    sizeFx(); fxParticles = [];
    for (let i = 0; i < 170; i++) fxParticles.push({
      x: fx.width/2 + (Math.random()-.5)*80, y: fx.height/2,
      vx: (Math.random()-.5)*12, vy: Math.random()*-15-6, g: .4+Math.random()*.2,
      s: 5+Math.random()*7, rot: Math.random()*Math.PI, vr: (Math.random()-.5)*.4,
      c: SEG_COLORS[i % SEG_COLORS.length]
    });
    animateFx("confetti");
  }
  function runFireworks() {
    sizeFx(); fxParticles = [];
    [[.3,.35],[.7,.3],[.5,.55],[.25,.6],[.78,.62]].forEach((b, bi) => {
      const cx = fx.width*b[0], cy = fx.height*b[1], hue = Math.floor(bi*67 % 360), count = 42;
      for (let i = 0; i < count; i++) {
        const a = (Math.PI*2*i)/count + (i%2)*.08, sp = 3+ (i%5);
        fxParticles.push({ x: cx, y: cy, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, g: .06, s: 3+(i%3),
          delay: bi*10, c: `hsl(${hue + (i%40)},100%,${62+(i%15)}%)`, life: 1, fade: .014 });
      }
    });
    animateFx("fireworks");
  }
  function animateFx(kind) {
    if (fxRAF) cancelAnimationFrame(fxRAF);
    function tick() {
      fxc.clearRect(0,0,fx.width,fx.height); let alive = 0;
      for (const p of fxParticles) {
        if (p.delay && p.delay-- > 0) { alive++; continue; }
        p.vy += p.g; p.x += p.vx; p.y += p.vy;
        if (kind === "confetti") {
          p.rot += p.vr; p.vx *= .99;
          if (p.y < fx.height + 20) alive++;
          fxc.save(); fxc.translate(p.x, p.y); fxc.rotate(p.rot); fxc.fillStyle = p.c;
          fxc.fillRect(-p.s/2, -p.s/2, p.s, p.s*.6); fxc.restore();
        } else {
          p.vx *= .98; p.vy *= .98; p.life -= p.fade; if (p.life > 0) alive++;
          fxc.globalAlpha = Math.max(0, p.life); fxc.fillStyle = p.c;
          fxc.beginPath(); fxc.arc(p.x, p.y, p.s, 0, Math.PI*2); fxc.fill(); fxc.globalAlpha = 1;
        }
      }
      if (alive > 0 && $("overlay").classList.contains("show")) fxRAF = requestAnimationFrame(tick); else stopFx();
    }
    fxRAF = requestAnimationFrame(tick);
  }

  /* ---------- EDITOR ---------- */
  function openEdit(isNew) {
    editingNew = isNew;
    if (isNew) {
      current = { id: "w"+Date.now(), name: "", emoji: draftEmoji, options: [] }; draftEmoji = "🎡";
      $("edit-title").textContent = "New wheel"; $("edit-newfields").style.display = "block";
      $("edit-name").value = ""; $("create-btn").style.display = "block"; $("btn-edit-done").style.display = "none";
      renderEmojiPick();
    } else {
      $("edit-title").textContent = "Edit list"; $("edit-newfields").style.display = "none";
      $("create-btn").style.display = "none"; $("btn-edit-done").style.display = "grid";
    }
    renderEditList(); show("edit");
  }
  function renderEmojiPick() {
    const box = $("emoji-pick"); box.innerHTML = "";
    EMOJIS.forEach(e => { const b = document.createElement("button"); b.textContent = e;
      if (e === draftEmoji) b.classList.add("sel");
      b.onclick = () => { draftEmoji = e; current.emoji = e; renderEmojiPick(); }; box.appendChild(b); });
  }
  function renderEditList() {
    const box = $("list-edit"); box.innerHTML = ""; $("opt-count").textContent = current.options.length;
    current.options.forEach((opt, i) => {
      const row = document.createElement("div"); row.className = "opt";
      row.innerHTML = `<span class="dot" style="background:${SEG_COLORS[i%SEG_COLORS.length]}"></span>
        <span>${esc(opt)}</span><button aria-label="Remove">✕</button>`;
      row.querySelector("button").onclick = () => { current.options.splice(i,1); renderEditList(); };
      box.appendChild(row);
    });
  }
  function addOption() {
    const inp = $("add-input"); const v = inp.value.trim(); if (!v) return;
    current.options.push(v); inp.value = ""; inp.focus(); renderEditList();
  }
  function commitNew() {
    current.name = $("edit-name").value.trim() || "Untitled wheel"; current.emoji = draftEmoji;
    wheels.push(current); renderMenu(); openWheel(current);
  }
  function finishEdit() { renderMenu(); openWheel(current); }

  /* ---------- utils ---------- */
  function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
  function shade(hex){ // dark or light text depending on bg luminance
    const c = hex.replace("#",""); const r=parseInt(c.slice(0,2),16), g=parseInt(c.slice(2,4),16), b=parseInt(c.slice(4,6),16);
    return (0.299*r+0.587*g+0.114*b) > 150 ? "#1a1030" : "#1a1030"; // segments are bright → always dark ink
  }

  /* ---------- wire up ---------- */
  $("btn-new").onclick = () => openEdit(true);
  $("btn-back").onclick = () => { show("menu"); renderMenu(); };
  $("btn-edit").onclick = () => openEdit(false);
  $("btn-spin").onclick = spin;
  $("btn-edit-back").onclick = () => { if (editingNew) show("menu"); else finishEdit(); };
  $("btn-edit-done").onclick = finishEdit;
  $("create-btn").onclick = commitNew;
  $("add-btn").onclick = addOption;
  $("add-input").addEventListener("keydown", e => { if (e.key === "Enter") addOption(); });
  $("result-close").onclick = () => { $("overlay").classList.remove("show"); stopFx(); };
  $("result-again").onclick = () => { $("overlay").classList.remove("show"); stopFx(); setTimeout(spin, 250); };

  renderMenu();
})();
</script>
